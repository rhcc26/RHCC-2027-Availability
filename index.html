<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RHCC Availability 2027</title><style>body{margin:0;background:#eef2f5;font:16px system-ui;color:#0f2537}header{background:#0f2537;color:white;padding:22px;border-bottom:4px solid #d4af37}main{max-width:850px;margin:auto;padding:16px}section,article{background:white;padding:16px;margin:12px 0;border-radius:12px}button,input,select{font:inherit;padding:10px;margin:4px;border:1px solid #b8c5cd;border-radius:8px;max-width:95%;box-sizing:border-box}button{background:#0f2537;color:white;cursor:pointer}button.on{background:#1e6b3a}button.out{background:#b91c1c}button.unsure{background:#a16207}input{width:100%}small{color:#52616c}#msg{white-space:pre-wrap;color:#a12626}h1{font-size:22px;margin:0}h2{font-size:19px}nav{display:flex;flex-wrap:wrap}label{display:block}details{padding:8px} </style><header><h1>Ryhill &amp; Havercroft Cricket Club</h1>1st XI • 2027 Availability</header><main><p id="msg" role="status"></p><div id="root">Connecting…</div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,doc,onSnapshot,setDoc,updateDoc,deleteDoc,query,where,getDocs,writeBatch} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyBhFcBrxhAMmSOlYz55Z-EFC38WE4iGhBU',authDomain:'rhcc-availability-2027.firebaseapp.com',projectId:'rhcc-availability-2027',storageBucket:'rhcc-availability-2027.firebasestorage.app',messagingSenderId:'803195382668',appId:'1:803195382668:web:73b8e89aa3c52d085884a9'}),auth=getAuth(app),db=getFirestore(app),base='artifacts/rhcc-1st-xi-2027/public/data';
const col=n=>collection(db,base,n),ref=(n,id)=>doc(db,base,n,id),root=document.querySelector('#root'),msg=document.querySelector('#msg');let user,profile,fixtures=[],players=[],availability=[],tab='mine',stops=[],profileStop,mode='login',expanded=new Set();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const roles=['All-Rounder','Top Order Batter','Middle Order Batter','Opening Bowler','Spin Bowler','Wicketkeeper-Batter'];const options=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');const admin=()=>profile?.role==='admin',staff=()=>admin()||profile?.role==='captain';const report=e=>msg.textContent=e?.message||String(e);const run=async f=>{try{msg.textContent='';await f()}catch(e){report(e)}};const btn=(label,action,cls='')=>`<button class="${cls}" data-action="${esc(action)}">${esc(label)}</button>`;const status=(p,f)=>availability.find(a=>a.playerId===p&&a.fixtureId===f)?.status||'none';
const opponents=['Rossington Main CC - 1st XI','Bentley Colliery CC - 1st XI','Cup Fixture','Crofton Phoenix CC - 2nd XI','Notton Challengers CC - 1st XI','Newton Hill CC - 1st XI','Rothwell CC, Yorks - 1st XI','Hooton Pagnell CC - 1st XI','Cup Fixture','Thurnscoe Institute CC - 1st XI','Cup Fixture','Featherstone Town CC - 1st XI','Rothwell CC, Yorks - 1st XI','Cup Fixture','Hooton Pagnell CC - 1st XI','Crofton Phoenix CC - 2nd XI','Newton Hill CC - 1st XI','Notton Challengers CC - 1st XI','Thurnscoe Institute CC - 1st XI','Featherstone Town CC - 1st XI','Bentley Colliery CC - 1st XI','Rossington Main CC - 1st XI'];const venues='AWAY HOME TBC AWAY AWAY HOME AWAY HOME TBC HOME TBC AWAY HOME TBC AWAY HOME AWAY HOME AWAY HOME AWAY HOME'.split(' ');const defaults=opponents.map((opponent,i)=>({id:'fix_'+String(i+1).padStart(2,'0'),order:i+1,date:new Date(Date.UTC(2027,3,17+i*7)).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}).replace(',',''),opponent,type:opponent==='Cup Fixture'?'Cup':'League',venue:venues[i]}));
function render(){if(!user){root.innerHTML=`<section><h2>${mode==='login'?'Sign in':'Register'}</h2><form id="authform"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="6" required></label><button>${mode==='login'?'Sign in':'Create account'}</button></form>${btn(mode==='login'?'New registration':'Back to sign in','toggle')}${btn('Reset password','reset')}</section>`;return}if(!profile){root.innerHTML=`<section><h2>Complete registration</h2><form id="profileform"><label>Full name<input name="name" required></label><label>Playing role<select name="playingRole">${options(roles)}</select></label><button>Request access</button></form>${btn('Sign out','logout')}</section>`;return}if(profile.status!=='approved'){root.innerHTML=`<section>Registration ${esc(profile.status)}. Please contact the administrator.${btn('Sign out','logout')}</section>`;return}let html=`<section><b>${esc(profile.name||user.email)}</b> · ${esc(profile.role)} ${btn('Sign out','logout')}<nav>${btn('My availability','tab:mine')}${staff()?btn('Squad availability','tab:squad'):''}${admin()?btn('Manage fixtures','tab:fixtures')+btn('Squad & approvals','tab:players'):''}</nav></section>`;if(tab==='mine'){html+=fixtures.map(f=>`<article><small>${esc(f.date)} · ${esc(f.venue)} · ${esc(f.type)}</small><h2>${esc(f.opponent)}</h2>${['available','unavailable','unsure'].map((s,i)=>btn(['Available','Unavailable','Not sure'][i],`avail:${user.uid}:${f.id}:${s}`,status(user.uid,f.id)===s?['on','out','unsure'][i]:'')).join('')}</article>`).join('')}if(tab==='squad'&&staff()){html+=fixtures.map(f=>{let ps=players.filter(p=>p.status==='approved'&&p.role!=='admin');return `<article><details data-fixture="${esc(f.id)}" ${expanded.has(f.id)?'open':''}><summary>${esc(f.date)} · ${esc(f.opponent)} — ${ps.filter(p=>status(p.id,f.id)==='available').length} available</summary>${['available','unavailable','unsure','none'].map(s=>`<h3>${s==='none'?'No response':s}</h3>${ps.filter(p=>status(p.id,f.id)===s).map(p=>`<p>${esc(p.name)} · ${esc(p.playingRole)} ${admin()?['available','unavailable','unsure'].map(t=>btn(t,`avail:${p.id}:${f.id}:${t}`)).join(''):''}</p>`).join('')||'None'}`).join('')}</details></article>`}).join('')}if(tab==='fixtures'&&admin()){html+=`<section>${btn('Load original 22 fixtures if empty','seed')}<h2>Add fixture</h2>${fixtureForm()}</section>`+fixtures.map(f=>`<article>${fixtureForm(f)}${btn('Remove fixture','df:'+f.id)}</article>`).join('')}if(tab==='players'&&admin()){html+=`<section><h2>Add manual player</h2><form id="manual"><input name="name" placeholder="Full name" required><select name="playingRole">${options(roles)}</select><button>Add player</button></form></section>`+players.map(p=>`<article><b>${esc(p.name||p.email||p.id)}</b> · ${esc(p.status)} · ${esc(p.role)}<p>${esc(p.email)}</p>${p.id===user.uid?'Your account':btn('Approve','ps:'+p.id+':approved')+btn('Reject','ps:'+p.id+':rejected')+btn('Make captain','pr:'+p.id+':captain')+btn('Make player','pr:'+p.id+':player')+btn('Remove','dp:'+p.id)}</article>`).join('')}root.innerHTML=html||'No fixtures';if(!fixtures.length&&tab==='mine')root.innerHTML+='<section>No fixtures loaded yet. Ask the administrator to load them.</section>'}
function fixtureForm(f={}){return `<form data-fix="${esc(f.id||'')}"><input name="date" placeholder="Sat 17 Apr 2027" value="${esc(f.date)}" required><input name="opponent" placeholder="Opponent" value="${esc(f.opponent)}" required><select name="type">${options(['League','Cup','Friendly'],f.type)}</select><select name="venue">${options(['HOME','AWAY','TBC'],f.venue)}</select><button>Save fixture</button></form>`}
function listen(){stops.forEach(f=>f());stops=[];fixtures=[];players=[];availability=[];if(profile?.status!=='approved')return;const watch=(q,fn)=>stops.push(onSnapshot(q,s=>{fn(s.docs.map(d=>({...d.data(),id:d.id})));render()},report));watch(col('fixtures'),x=>fixtures=x.sort((a,b)=>a.order-b.order));if(staff())watch(col('players'),x=>players=x);watch(staff()?col('availability'):query(col('availability'),where('playerId','==',user.uid)),x=>availability=x)}
onAuthStateChanged(auth,u=>{profileStop?.();stops.forEach(f=>f());stops=[];user=u;profile=null;tab='mine';if(!u){render();return}root.textContent='Loading profile…';profileStop=onSnapshot(ref('players',u.uid),s=>{profile=s.exists()?s.data():null;listen();render()},report)});
root.addEventListener('toggle',e=>{if(e.target.dataset.fixture){if(e.target.open)expanded.add(e.target.dataset.fixture);else expanded.delete(e.target.dataset.fixture)}},true);
root.onclick=e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;run(async()=>{let [k,p,f,s]=a.split(':');if(k==='toggle'){mode=mode==='login'?'register':'login';render()}if(k==='logout')await signOut(auth);if(k==='reset'){let email=root.querySelector('[name=email]').value;if(!email)throw Error('Enter your email first.');await sendPasswordResetEmail(auth,email);msg.textContent='Password reset requested.'}if(k==='tab'){tab=p;render()}if(k==='avail')await setDoc(ref('availability',p+'_'+f),{playerId:p,fixtureId:f,status:s,updatedAt:new Date().toISOString(),updatedBy:profile.name||user.email});if(k==='seed'){if(!(await getDocs(col('fixtures'))).empty)throw Error('Fixtures already exist.');let b=writeBatch(db);defaults.forEach(x=>b.set(ref('fixtures',x.id),x));await b.commit()}if(k==='ps')await updateDoc(ref('players',p),{status:f});if(k==='pr')await updateDoc(ref('players',p),{role:f});if(k==='dp'&&confirm('Remove this player?'))await deleteDoc(ref('players',p));if(k==='df'&&confirm('Remove this fixture?'))await deleteDoc(ref('fixtures',p))})};
root.onsubmit=e=>{e.preventDefault();let form=e.target,d=Object.fromEntries(new FormData(form));run(async()=>{if(form.id==='authform'){if(mode==='login')await signInWithEmailAndPassword(auth,d.email,d.password);else await createUserWithEmailAndPassword(auth,d.email,d.password)}else if(form.id==='profileform'){await setDoc(ref('players',user.uid),{...d,email:user.email,role:'player',status:'pending',isManual:false,createdAt:new Date().toISOString()})}else if(form.id==='manual'){await setDoc(ref('players','manual_'+Date.now()),{...d,email:'',role:'player',status:'approved',isManual:true,createdAt:new Date().toISOString()});form.reset()}else if(form.dataset.fix!==undefined){let id=form.dataset.fix||'fix_'+Date.now();await setDoc(ref('fixtures',id),{...d,id,order:fixtures.find(f=>f.id===id)?.order||Math.max(0,...fixtures.map(f=>f.order))+1});}})};
</script></html>
