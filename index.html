function render(){if(!user){root.innerHTML=`<section><h2>${mode==='login'?'Sign in':'Register'}</h2><form id="authform"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="6" required></label><button>${mode==='login'?'Sign in':'Create account'}</button></form>${btn(mode==='login'?'New registration':'Back to sign in','toggle')}${btn('Reset password','reset')}</section>`;return}if(!profile){root.innerHTML=`<section><h2>Complete registration</h2><form id="profileform"><label>Full name<input name="name" required></label><label>Playing role<select name="playingRole">${options(roles)}</select></label><button>Request access</button></form>${btn('Sign out','logout')}</section>`;return}if(profile.status!=='approved'){root.innerHTML=`<section>Registration ${esc(profile.status)}. Please contact the administrator.${btn('Sign out','logout')}</section>`;return}let html=`<section><b>${esc(profile.name||user.email)}</b> · ${esc(profile.role)} ${btn('Sign out','logout')}<nav>${btn('My availability','tab:mine')}${staff()?btn('Squad availability','tab:squad'):''}${admin()?btn('Manage fixtures','tab:fixtures')+btn('Squad & approvals','tab:players'):''}</nav></section>`;if(tab==='mine'){html+=fixtures.map(f=>`<article><small>${esc(f.date)} · ${esc(f.venue)} · ${esc(f.type)}</small><h2>${esc(f.opponent)}</h2>${['available','unavailable','unsure'].map((s,i)=>btn(['Available','Unavailable','Not sure'][i],`avail:${user.uid}:${f.id}:${s}`,status(user.uid,f.id)===s?['on','out','unsure'][i]:'')).join('')}</article>`).join('')}if(tab==='squad'&&staff()){html+=fixtures.map(f=>{let ps=players.filter(p=>p.status==='approved'&&p.role!=='admin');return `<article><details data-fixture="${esc(f.id)}" ${expanded.has(f.id)?'open':''}><summary>${esc(f.date)} · ${esc(f.opponent)} — ${ps.filter(p=>status(p.id,f.id)==='available').length} available</summary>${['available','unavailable','unsure','none'].map(s=>`<div class="group ${s}"><h3>${({available:'Available',unavailable:'Unavailable',unsure:'Not sure',none:'No response'})[s]} (${ps.filter(p=>status(p.id,f.id)===s).length})</h3>${ps.filter(p=>status(p.id,f.id)===s).map(p=>btn(p.name||p.email||p.id,`choose:${p.id}:${f.id}`,'playername')).join('')||'None'}</div>`).join('')}</details></article>`}).join('')}if(tab==='fixtures'&&admin()){html+=`<section>${btn('Load original 22 fixtures if empty','seed')}<h2>Add fixture</h2>${fixtureForm()}</section>`+fixtures.map(f=>`<article>${fixtureForm(f)}${btn('Remove fixture','df:'+f.id)}</article>`).join('')}if(tab==='players'&&admin()){html+=`<section><h2>Add manual player</h2><form id="manual"><input name="name" placeholder="Full name" required><select name="playingRole">${options(roles)}</select><button>Add player</button></form></section>`+players.map(p=>`<article><b>${esc(p.name||p.email||p.id)}</b> · ${esc(p.status)} · ${esc(p.role)}<p>${esc(p.email)}</p>${p.id===user.uid?'Your account':btn('Approve','ps:'+p.id+':approved')+btn('Reject','ps:'+p.id+':rejected')+btn('Make captain','pr:'+p.id+':captain')+btn('Make player','pr:'+p.id+':player')+btn('Remove','dp:'+p.id)}</article>`).join('')}root.innerHTML=html||'No fixtures';if(!fixtures.length&&tab==='mine')root.innerHTML+='<section>No fixtures loaded yet. Ask the administrator to load them.</section>'}
function fixtureForm(f={}){return `<form data-fix="${esc(f.id||'')}"><input name="date" placeholder="Sat 17 Apr 2027" value="${esc(f.date)}" required><input name="opponent" placeholder="Opponent" value="${esc(f.opponent)}" required><select name="type">${options(['League','Cup','Friendly'],f.type)}</select><select name="venue">${options(['HOME','AWAY','TBC'],f.venue)}</select><button>Save fixture</button></form>`}
function listen(){stops.forEach(f=>f());stops=[];fixtures=[];players=[];availability=[];if(profile?.status!=='approved')return;const watch=(q,fn)=>stops.push(onSnapshot(q,s=>{fn(s.docs.map(d=>({...d.data(),id:d.id})));render()},report));watch(col('fixtures'),x=>fixtures=x.sort((a,b)=>a.order-b.order));if(staff())watch(col('players'),x=>players=x);watch(staff()?col('availability'):query(col('availability'),where('playerId','==',user.uid)),x=>availability=x)}
onAuthStateChanged(auth,u=>{profileStop?.();stops.forEach(f=>f());stops=[];user=u;profile=null;tab='mine';if(!u){render();return}root.textContent='Loading profile…';profileStop=onSnapshot(ref('players',u.uid),s=>{profile=s.exists()?s.data():null;listen();render()},report)});
root.addEventListener('toggle',e=>{if(e.target.dataset.fixture){if(e.target.open)expanded.add(e.target.dataset.fixture);else expanded.delete(e.target.dataset.fixture)}},true);
const choice=document.querySelector('#choice');document.querySelector('#cancelChoice').onclick=()=>choice.close();document.querySelector('#choiceButtons').onclick=e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(!a||!staff())return;const [k,p,f,s]=a.split(':');choice.close();run(()=>setDoc(ref('availability',p+'_'+f),{playerId:p,fixtureId:f,status:s,updatedAt:new Date().toISOString(),updatedBy:profile.name||user.email}));};
root.onclick=e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;run(async()=>{let [k,p,f,s]=a.split(':');if(k==='toggle'){mode=mode==='login'?'register':'login';render()}if(k==='logout')await signOut(auth);if(k==='reset'){let email=root.querySelector('[name=email]').value;if(!email)throw Error('Enter your email first.');await sendPasswordResetEmail(auth,email);msg.textContent='Password reset requested.'}if(k==='tab'){tab=p;render()}if(k==='choose'&&staff()){document.querySelector('#choiceName').textContent=players.find(x=>x.id===p)?.name||'Change availability';document.querySelector('#choiceButtons').innerHTML=['available','unavailable','unsure'].map((t,i)=>btn(['Available','Unavailable','Not sure'][i],`avail:${p}:${f}:${t}`,['on','out','unsure'][i])).join('');choice.showModal()}if(k==='avail')await setDoc(ref('availability',p+'_'+f),{playerId:p,fixtureId:f,status:s,updatedAt:new Date().toISOString(),updatedBy:profile.name||user.email});if(k==='seed'){if(!(await getDocs(col('fixtures'))).empty)throw Error('Fixtures already exist.');let b=writeBatch(db);defaults.forEach(x=>b.set(ref('fixtures',x.id),x));await b.commit()}if(k==='ps')await updateDoc(ref('players',p),{status:f});if(k==='pr')await updateDoc(ref('players',p),{role:f});if(k==='dp'&&confirm('Remove this player?'))await deleteDoc(ref('players',p));if(k==='df'&&confirm('Remove this fixture?'))await deleteDoc(ref('fixtures',p))})};
root.onsubmit=e=>{e.preventDefault();let form=e.target,d=Object.fromEntries(new FormData(form));run(async()=>{if(form.id==='authform'){if(mode==='login')await signInWithEmailAndPassword(auth,d.email,d.password);else await createUserWithEmailAndPassword(auth,d.email,d.password)}else if(form.id==='profileform'){await setDoc(ref('players',user.uid),{...d,email:user.email,role:'player',status:'pending',isManual:false,createdAt:new Date().toISOString()})}else if(form.id==='manual'){await setDoc(ref('players','manual_'+Date.now()),{...d,email:'',role:'player',status:'approved',isManual:true,createdAt:new Date().toISOString()});form.reset()}else if(form.dataset.fix!==undefined){let id=form.dataset.fix||'fix_'+Date.now();await setDoc(ref('fixtures',id),{...d,id,order:fixtures.find(f=>f.id===id)?.order||Math.max(0,...fixtures.map(f=>f.order))+1});}})};
</script></html>
